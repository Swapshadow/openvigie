name: openvigie

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - openvigie_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  collector:
    build:
      context: ./services/collector
      dockerfile: Dockerfile
    init: true
    environment:
      NVD_API_KEY: ${NVD_API_KEY:-}
      OPENVIGIE_DB_PATH: /data/openvigie.db
      OPENVIGIE_REFRESH_SECONDS: ${OPENVIGIE_REFRESH_SECONDS:-86400}
      OPENVIGIE_FEED_REFRESH_SECONDS: ${OPENVIGIE_FEED_REFRESH_SECONDS:-10800}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - openvigie_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NVD_API_KEY: ${NVD_API_KEY:-}
      OPENVIGIE_COLLECTOR_URL: http://collector:8787
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openvigie_data:
  openvigie_ollama:
